<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>{{TITLE}}</title>
<style>
  /* ------------------------------------------------------------------
     ATS-oriented resume stylesheet.
     Single column, real selectable text, no layout tables, no images,
     no decorative rating systems. Black on white.
     ------------------------------------------------------------------ */

  @page {
    size: A4;
    margin: 14mm 15mm;
  }

  * { box-sizing: border-box; }

  html {
    font-size: 10pt;
  }

  body {
    margin: 0;
    font-family: "Helvetica Neue", Helvetica, Arial, "Liberation Sans", sans-serif;
    font-size: 1rem;
    line-height: 1.33;
    color: #000;
    background: #fff;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- headings ---------- */

  h1 {
    font-size: 1.95rem;
    line-height: 1.1;
    letter-spacing: -0.01em;
    margin: 0 0 0.2rem;
  }

  h2 {
    font-size: 0.95rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
    margin: 0.95rem 0 0.42rem;
    padding-bottom: 0.18rem;
    border-bottom: 1px solid #000;
    break-after: avoid;
    page-break-after: avoid;
  }

  h3 {
    font-size: 1.08rem;
    margin: 0.7rem 0 0.08rem;
    break-after: avoid;
    page-break-after: avoid;
  }

  h4 {
    font-size: 1rem;
    margin: 0.65rem 0 0.1rem;
    break-after: avoid;
    page-break-after: avoid;
  }

  /* Keep a heading attached to the block that follows it. */
  h2 + *, h3 + *, h4 + * {
    break-before: avoid;
    page-break-before: avoid;
  }

  /* ---------- text ---------- */

  p {
    margin: 0 0 0.38rem;
    orphans: 2;
    widows: 2;
  }

  strong { font-weight: 700; }

  a {
    color: #000;
    text-decoration: none;
  }

  hr {
    border: 0;
    height: 0;
    margin: 0.35rem 0 0;
  }

  /* ---------- lists ---------- */

  ul {
    margin: 0.16rem 0 0.42rem;
    padding-left: 1.05rem;
  }

  li {
    margin-bottom: 0.12rem;
    orphans: 2;
    widows: 2;
  }

  li:last-child { margin-bottom: 0; }

  /* A nested list is short enough to always keep with its parent bullet. */
  ul ul {
    margin: 0.12rem 0 0.12rem;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  li:has(> ul) {
    break-inside: avoid;
    page-break-inside: avoid;
  }

  /* ---------- header block ---------- */

  .masthead { margin-bottom: 0.7rem; }

  .masthead > p:first-of-type {
    font-size: 1.05rem;
    margin-bottom: 0.35rem;
  }

  .masthead p { margin-bottom: 0.25rem; }

  .masthead p:last-child { margin-bottom: 0; }

  /* ---------- technical skills ---------- */

  /* The subsection heading runs into its values as a single text flow.
     A grid or column layout here would interleave label and value text
     when the PDF is parsed, so this stays one continuous line of text. */
  .skills .skill-row {
    margin-bottom: 0.22rem;
    break-inside: avoid;
    page-break-inside: avoid;
  }

  .skills .skill-row h3,
  .skills .skill-row p {
    display: inline;
  }

  .skills .skill-row h3::after {
    content: " — ";
    font-weight: 400;
  }

  .skills h3 {
    font-size: 1rem;
    font-weight: 700;
    margin: 0 0 0.22rem;
  }

  .skills p { margin: 0 0 0.22rem; }

  /* ---------- project blocks ---------- */

  .project {
    break-inside: avoid;
    page-break-inside: avoid;
    margin-bottom: 0.15rem;
  }

  /* The dated line directly under a job heading. */
  h3 + p strong { font-weight: 700; }

  @media screen {
    body {
      max-width: 210mm;
      margin: 0 auto;
      padding: 14mm 15mm;
    }
  }
</style>
</head>
<body>
{{CONTENT}}
</body>
</html>
